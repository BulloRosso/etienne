              - heading "Risiken & Abweichungen" [level=2] [ref=f16e322]
              - paragraph [ref=f16e323]:
                - strong [ref=f16e324]: "REQ-131 (Gefahrgutlagerung Klasse 3):"
                - text: MUSS-Anforderung ohne Nachweis. Die Ausschreibung verlangt ein separates Gefahrgutlager gemäß TRGS 510 für entzündbare Flüssigkeiten (Reinigungsmittel). Unser Katalog enthält keine Gefahrgutlagerung. Ohne diesen Nachweis droht der Ausschluss, da es sich um eine zwingende Anforderung für das Sortiment handelt.
              - paragraph [ref=f16e325]:
                - strong [ref=f16e326]: "REQ-121 und REQ-145 (Lagerfläche und Palettenstellplätze):"
                - text: MUSS-Anforderungen ohne Kapazitätsnachweis. Gefordert sind 18.500 m² Hallenfläche und 12.400 Palettenstellplätze (Hochregal + Block). Der Servicekatalog dokumentiert keine verfügbaren Flächen oder Stellplatzkapazitäten. Ohne konkrete Standortangaben und Kapazitätsnachweise ist die Erfüllung dieser Grundvoraussetzungen nicht belegbar.
              - paragraph [ref=f16e327]:
                - strong [ref=f16e328]: "REQ-122 und REQ-132 (Kühlzone 2–8 °C):"
                - text: "PARTIAL-Bewertung bei MUSS-Anforderung. SVC-003 deckt den Temperaturbetrieb ab, setzt jedoch voraus, dass die Kühltechnik vom Auftraggeber gestellt wird. Die Ausschreibung verlangt aber, dass der Auftragnehmer die Kühlzone betreibt. Zudem fehlt der Nachweis, dass 1.200 m² Kühlfläche verfügbar sind. Risiko: Die geteilte Verantwortung (Auftraggeber stellt Technik, wir betreiben) könnte als unzureichende Erfüllung der Betreiberpflicht gewertet werden."
