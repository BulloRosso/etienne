                    - cell "Bieten wir Inbound-Handling, Bestandsführung mit permanenter Inventur und Returns Management an? Können wir bestätigen, dass alle fünf Prozessschritte (Wareneingang, Lagerung, Kommissionierung, Warenausgang, Retourenabwicklung) für das Sortiment Haushaltswaren und Elektrokleingeräte abgedeckt sind?" [ref=f16e426]
                    - cell "Operations Lead" [ref=f16e427]
                  - row [ref=f16e428]:
                    - cell "REQ-121" [ref=f16e429]
                    - cell "Verfügt das Unternehmen über mindestens 18.500 m² Hallenfläche, davon mindestens 1.200 m² als temperaturgeführte Kühlzone (2–8 °C)? Bitte Standort, Gesamtfläche und Kühlzonenfläche konkret benennen." [ref=f16e430]
                    - cell "Logistics Operations Manager" [ref=f16e431]
                  - row [ref=f16e432]:
                    - cell "REQ-123" [ref=f16e433]
                    - 'cell "Welche maximale Tageskapazität (Pickpositionen/Tag) kann der Service Order Fulfillment (Picking & Packing) im Durchschnitt und in Spitzenzeiten leisten? Anforderung: durchschnittlich 2.300, Spitze bis 3.800 Pickpositionen/Tag." [ref=f16e434]'
                    - cell "Operations Manager" [ref=f16e435]
                  - row [ref=f16e436]:
                    - cell "REQ-124" [ref=f16e437]
                    - cell "Welche maximale Tageskapazität (Pickpositionen/Tag) kann unser Order Fulfillment Service (SVC-004) während Spitzenzeiten (November/Dezember) mit Peak-Personal leisten? Können wir 3.800 Pickpositionen/Tag garantieren?" [ref=f16e438]
                    - cell "Operations Manager" [ref=f16e439]
                  - row [ref=f16e440]:
                    - cell "REQ-131" [ref=f16e441]
                    - cell "Verfügt das Unternehmen über ein separates Gefahrgutlager gemäß TRGS 510 für die Lagerung von Gefahrgütern der Klasse 3 (entzündbare Flüssigkeiten wie Reinigungsmittel)? Falls ja, welche Zulassungen und Nachweise liegen vor?" [ref=f16e442]
                    - cell "Lagerleiter" [ref=f16e443]
                  - row [ref=f16e444]:
                    - cell "REQ-137" [ref=f16e445]
                    - cell "Kann das Unternehmen den Vertragsbeginn verbindlich auf den 01.04.2027 festlegen und alle erforderlichen Vorbereitungen (insbesondere Betriebsübernahme mit 8-wöchiger Vorlaufzeit für Personalunterlagen gemäß SVC-009) bis zu diesem Datum abschließen?" [ref=f16e446]
                    - cell "Vertragsmanagement" [ref=f16e447]
                  - row [ref=f16e448]:
                    - cell "REQ-138" [ref=f16e449]
                    - cell "Ist das Unternehmen bereit, einen Vertrag mit fester Laufzeit von 48 Monaten (01.04.2027 bis 31.03.2031) ohne ordentliche Kündigungsmöglichkeit abzuschließen?" [ref=f16e450]
                    - cell "Vertriebsleitung" [ref=f16e451]
                  - row [ref=f16e452]:
                    - cell "REQ-139" [ref=f16e453]
                    - cell "Bietet das Unternehmen feste Preise für die gesamte Vertragslaufzeit an, und sind Preisanpassungen ausschließlich bei Tariflohnänderungen über 3 % vorgesehen, oder gibt es andere Indexierungsklauseln in den Standardverträgen?" [ref=f16e454]
                    - cell "Commercial Manager" [ref=f16e455]
                  - row [ref=f16e456]:
                    - cell "REQ-140" [ref=f16e457]
                    - cell "Akzeptiert das Unternehmen die Malus-Regelung von 2 % der Monatsvergütung bei Unterschreitung der Inventurgenauigkeit von 99,5 % in zwei aufeinanderfolgenden Monaten? Falls ja, muss dies vertraglich fixiert werden." [ref=f16e458]
                    - cell "Commercial Manager" [ref=f16e459]
                  - row [ref=f16e460]:
                    - cell "REQ-141" [ref=f16e461]
                    - cell "Ist das Unternehmen bereit, eine Bonusvereinbarung von 1 % der Quartalsvergütung bei Überschreitung von 99 % Termintreue über ein Quartal in den Vertrag aufzunehmen? Welche vertraglichen und kaufmännischen Rahmenbedingungen müssen dafür geschaffen werden?" [ref=f16e462]
                    - cell "Commercial Manager" [ref=f16e463]
                  - row [ref=f16e464]:
                    - cell "REQ-144" [ref=f16e465]
                    - cell "Verfügt das Unternehmen über die technischen und organisatorischen Voraussetzungen, um Angebote elektronisch über die Vergabeplattform bis zum 15.11.2026, 12:00 Uhr einzureichen? Welche Prozesse und Systeme sind dafür etabliert?" [ref=f16e466]
                    - cell "Bid Manager" [ref=f16e467]
                  - row [ref=f16e468]:
                    - cell "REQ-145" [ref=f16e469]
                    - cell "Verfügt das Unternehmen über Hochregallager und Blocklager mit insgesamt mindestens 12.400 Palettenstellplätzen? Falls ja, bitte genaue Kapazitätsangaben (Hochregallager und Blocklager getrennt) sowie technische Spezifikationen der Lagerinfrastruktur bereitstellen." [ref=f16e470]
                    - cell "Warehouse Operations Manager" [ref=f16e471]
                  - row [ref=f16e472]:
                    - cell "REQ-155" [ref=f16e473]
                    - cell "Existiert ein dokumentierter Prozess zur Meldung von Störungen des Lagerbetriebs an den Auftraggeber innerhalb von 2 Stunden? Falls ja, welche Störungsarten sind abgedeckt und wie erfolgt die Eskalation?" [ref=f16e474]
                    - cell "Operations Manager" [ref=f16e475]
                  - row [ref=f16e476]:
                    - cell "REQ-157" [ref=f16e477]
                    - cell "Akzeptiert das Unternehmen eine Preisbindung für die Vertragslaufzeit mit Anpassungsrecht nur bei Tariflohnänderungen >3 %? Welche Preisanpassungsklauseln sind in Standardverträgen vorgesehen?" [ref=f16e478]
                    - cell "Commercial Manager" [ref=f16e479]
                  - row [ref=f16e480]:
                    - cell "REQ-158" [ref=f16e481]
                    - cell "Ist der Auftragnehmer bereit, für Bestandsdifferenzen oberhalb der vereinbarten Inventurgenauigkeit (99,7 %) eine vertragliche Haftung bis zu 250.000 € je Vertragsjahr zu übernehmen? Falls ja, welche Bedingungen gelten für diese Haftung?" [ref=f16e482]
                    - cell "Commercial Director" [ref=f16e483]
                  - row [ref=f16e484]:
                    - cell "REQ-159" [ref=f16e485]
                    - cell "Verfügt das Unternehmen über eine Lagerhaftpflichtversicherung mit einer Deckungssumme von mindestens 5 Mio. €? Falls ja, bitte Versicherungsnachweis (Police oder Bestätigung des Versicherers) beifügen." [ref=f16e486]
                    - cell "Geschäftsführung oder Versicherungsbeauftragter" [ref=f16e487]
              - heading "Empfehlung / nächste Schritte" [level=2] [ref=f16e488]
              - list [ref=f16e489]:
                - listitem [ref=f16e490]:
                  - paragraph [ref=f16e491]:
                    - strong [ref=f16e492]: "Keine Angebotsabgabe ohne Klärung der Ausschlusskriterien:"
                    - text: Die fehlenden Nachweise zu Gefahrgutlagerung (REQ-131), Lagerfläche (REQ-121) und Palettenstellplätzen (REQ-145) sind K.O.-Kriterien. Operations Lead und Warehouse Operations Manager müssen innerhalb von 5 Werktagen prüfen, ob diese Kapazitäten verfügbar sind oder beschafft werden können.
                - listitem [ref=f16e493]:
                  - paragraph [ref=f16e494]:
                    - strong [ref=f16e495]: "Alle 15 Kundenfragen vor Angebotserstellung stellen:"
                    - text: Die Klärungen zu Echtzeit-Latenz (REQ-147), Retourenbearbeitungsfristen (REQ-150), Schnittstellen-Spezifikationen (REQ-152) und Haftungsregelungen (REQ-158) sind für die Preiskalkulation und Risikoeinschätzung zwingend erforderlich. Bid Manager koordiniert die Einreichung bis spätestens 25.10.2026.
                - listitem [ref=f16e496]:
                  - paragraph [ref=f16e497]:
                    - strong [ref=f16e498]: "Kommerzielle Rahmenbedingungen intern festlegen:"
                    - text: Commercial Manager und Geschäftsführung müssen bis 01.11.2026 entscheiden, ob wir die feste 48-Monats-Laufzeit (REQ-138), Preisbindung (REQ-139), Malus-/Bonusregelungen (REQ-140, REQ-141) und Haftungsobergrenze von 250.000 € (REQ-158) akzeptieren. Ohne diese Zusagen ist kein rechtsverbindliches Angebot möglich.
                - listitem [ref=f16e499]:
                  - paragraph [ref=f16e500]:
                    - strong [ref=f16e501]: "Versicherungsnachweis beschaffen:"
                    - text: Die Lagerhaftpflichtversicherung mit 5 Mio. € Deckungssumme (REQ-159) muss bis zur Angebotsabgabe vorliegen. Versicherungsbeauftragter prüft bestehende Police oder holt Angebot ein.
                - listitem [ref=f16e502]:
                  - paragraph [ref=f16e503]:
                    - strong [ref=f16e504]: "Angebotsabgabe unter Vorbehalt nur bei positiver Klärung:"
                    - text: Falls die internen Prüfungen (Punkte 1, 3, 4) positiv ausfallen und die Kundenantworten keine weiteren Ausschlusskriterien ergeben, kann ein Angebot bis 15.11.2026, 12:00 Uhr abgegeben werden. Preiskalkulation muss die teilweise Erfüllung bei REQ-122 (Kühltechnik), REQ-133 (Cut-off 15:00 statt 14:00 Uhr) und REQ-143 (5 statt 3 Tage Schulung) berücksichtigen und als Abweichungen transparent kommunizieren.
