              - heading "Management-Analyse Ausschreibung" [level=1] [ref=f16e191]
              - blockquote [ref=f16e192]:
                - paragraph [ref=f16e193]:
                  - text: ⚠️
                  - strong [ref=f16e194]: Analyse mit Vorbehalten
                  - text: — 15 Klärungsfrage(n) an den Kunden, 16 interne Rückfrage(n), 0 ungeklärte(r) Zahlenwiderspruch/-sprüche. Die Bewertung gilt unter diesen Vorbehalten.
              - heading "Management Summary" [level=2] [ref=f16e195]
              - paragraph [ref=f16e196]: Die Ausschreibung der Nordland Handels AG umfasst den Vollbetrieb eines Logistikzentrums mit 18.500 m² Hallenfläche (davon 1.200 m² temperaturgeführt 2–8 °C) für das Sortiment Haushaltswaren und Elektrokleingeräte. Die Vertragslaufzeit beträgt 48 Monate ab 01.04.2027. Unser Leistungskatalog deckt die Kernprozesse Kommissionierung, Warenausgang, Retourenabwicklung und Bestandsführung vollständig ab. Kritische Lücken bestehen bei der Gefahrgutlagerung (Klasse 3), der Lagerflächen- und Kapazitätsnachweise sowie bei allen kommerziellen Vertragsbedingungen.
              - paragraph [ref=f16e197]: "Die Analyse trägt erhebliche Vorbehalte: Von 40 Anforderungen sind 16 als NEEDS_INPUT klassifiziert, da zentrale Informationen zu Lagerkapazitäten, Durchsatzmengen, Gefahrgutlagerung und kommerziellen Konditionen fehlen. 15 Kundenfragen und 16 interne Klärungspunkte sind offen. Zwei Zahlenwidersprüche zwischen Leistungsbeschreibung und Mengengerüst (Palettenstellplätze: 12.400 vs. 12.000; Wareneingangsbuchung: 4 vs. 6 Stunden) wurden vom Kunden bereits geklärt. 15 MUSS-Anforderungen haben keine Entsprechung im Leistungskatalog, darunter alle kommerziellen Anforderungen (Vertragslaufzeit, Preisbindung, Haftung, Versicherung) sowie operative Kernpunkte (Lagerfläche, Gefahrgutlagerung, Durchsatzkapazität)."
              - paragraph [ref=f16e198]: Eine Angebotsabgabe ist erst nach Klärung der 15 Kundenfragen und Beschaffung der fehlenden internen Nachweise möglich. Die Zuschlagschancen hängen maßgeblich davon ab, ob wir die geforderte Lagerfläche, Palettenstellplätze und Gefahrgutlagerung nachweisen können. Ohne diese Nachweise ist eine Teilnahme nicht sinnvoll.
              - heading "Erfüllungsgrad je Leistungsbereich" [level=2] [ref=f16e199]
              - paragraph [ref=f16e200]: "Funktionale Anforderungen (Lagerfläche, Kühlzone, Gefahrgut): 2 von 5 teilweise erfüllt, 3 ohne Nachweis. Leistungsanforderungen (Durchsatz, Inventurgenauigkeit): 2 vollständig, 1 teilweise, 2 ohne Kapazitätsnachweis. Prozessanforderungen (Wareneingang, Kommissionierung, Retouren): 6 vollständig, 8 teilweise erfüllt. Kommerzielle Anforderungen (Vertragslaufzeit, Preise, Haftung): alle 7 ohne Evidenz. Schnittstellen (WMS-Anbindung, Echtzeit-Bestände): 2 vollständig, 2 teilweise erfüllt."
