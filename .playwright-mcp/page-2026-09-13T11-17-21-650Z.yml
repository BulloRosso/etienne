                    - cell "Operations Manager" [ref=f4e427]
                  - row [ref=f4e428]:
                    - cell "REQ-069" [ref=f4e429]
                    - cell "Kann das Unternehmen den Vertragsbeginn verbindlich auf den 01.04.2027 festlegen, und gibt es Vorlaufzeiten oder organisatorische Einschränkungen, die diesem Datum entgegenstehen könnten?" [ref=f4e430]
                    - cell "Vertriebsleitung" [ref=f4e431]
                  - row [ref=f4e432]:
                    - cell "REQ-070" [ref=f4e433]
                    - cell "Kann das Unternehmen einen Vertrag mit fester Laufzeit von 48 Monaten (01.04.2027 bis 31.03.2031) ohne Kündigungsmöglichkeit anbieten, oder gibt es standardmäßige Mindest-/Maximallaufzeiten in den Vertragsvorlagen?" [ref=f4e434]
                    - cell "Vertriebsleiter" [ref=f4e435]
                  - row [ref=f4e436]:
                    - cell "REQ-071" [ref=f4e437]
                    - cell "Akzeptiert das Unternehmen eine Bonusregelung von 1 % der Quartalsvergütung bei Termintreue über 99 % über ein Quartal? Welche vertraglichen und kalkulatorischen Rahmenbedingungen gelten für solche Bonusvereinbarungen?" [ref=f4e438]
                    - cell "Commercial Manager" [ref=f4e439]
                  - row [ref=f4e440]:
                    - cell "REQ-074" [ref=f4e441]
                    - cell "Verfügt das Unternehmen über die technischen und organisatorischen Voraussetzungen zur fristgerechten elektronischen Einreichung des Angebots über die Vergabeplattform bis zum 15.11.2026, 12:00 Uhr? Welche internen Prozesse und Verantwortlichkeiten sind für die Angebotserstellung und -einreichung etabliert?" [ref=f4e442]
                    - cell "Bid Manager" [ref=f4e443]
                  - row [ref=f4e444]:
                    - cell "REQ-104" [ref=f4e445]
                    - cell "Verfügt das Unternehmen über Hochregallager und Blocklager mit insgesamt mindestens 12.400 Palettenstellplätzen, oder kann diese Kapazität bis Betriebsstart bereitgestellt werden?" [ref=f4e446]
                    - cell "Operations Manager" [ref=f4e447]
                  - row [ref=f4e448]:
                    - cell "REQ-115" [ref=f4e449]
                    - cell "Kann das Unternehmen für die gesamte Vertragslaufzeit feste Preise garantieren, wobei Anpassungen nur bei Tariflohnänderungen über 3 % zulässig sind? Welche Preisanpassungsklauseln sind in den Standardverträgen vorgesehen?" [ref=f4e450]
                    - cell "Kaufmännischer Leiter" [ref=f4e451]
                  - row [ref=f4e452]:
                    - cell "REQ-116" [ref=f4e453]
                    - cell "Bietet das Unternehmen Festpreise über die gesamte Vertragslaufzeit an, und ist eine Preisanpassungsklausel bei Tariflohnänderungen über 3 % im Standardvertrag vorgesehen?" [ref=f4e454]
                    - cell "Commercial Manager" [ref=f4e455]
                  - row [ref=f4e456]:
                    - cell "REQ-118" [ref=f4e457]
                    - cell "Ist das Unternehmen bereit, eine vertragliche Haftung für Bestandsdifferenzen oberhalb der Inventurgenauigkeit von 99,7 % bis zu einer Höhe von 250.000 € je Vertragsjahr zu übernehmen? Falls ja, ist diese Haftungssumme versicherungstechnisch abgedeckt?" [ref=f4e458]
                    - cell "Geschäftsführung / Vertragsmanagement" [ref=f4e459]
                  - row [ref=f4e460]:
                    - cell "REQ-119" [ref=f4e461]
                    - cell "Verfügt das Unternehmen über eine Lagerhaftpflichtversicherung mit einer Deckungssumme von mindestens 5 Mio. €? Falls ja, bitte Police oder Versicherungsbestätigung zur Verfügung stellen." [ref=f4e462]
                    - cell "Geschäftsführung oder Versicherungsbeauftragter" [ref=f4e463]
              - heading "Empfehlung / nächste Schritte" [level=2] [ref=f4e464]
              - list [ref=f4e465]:
                - listitem [ref=f4e466]:
                  - paragraph [ref=f4e467]:
                    - strong [ref=f4e468]: "Keine Angebotsabgabe ohne Klärung REQ-061:"
                    - text: "Prüfung durch Operations Manager, ob Gefahrgutlagerung Klasse 3 durch Subunternehmer oder Infrastrukturinvestition bis 01.04.2027 realisierbar ist. Alternativ: Ausschluss dieser Position aus dem Angebot mit Hinweis auf Katalogbeschränkung."
                - listitem [ref=f4e469]:
                  - paragraph [ref=f4e470]:
                    - strong [ref=f4e471]: "Geschäftsführung entscheidet über kommerzielle Rahmenbedingungen:"
                    - text: Akzeptanz der Malus-Regelung (REQ-117), Haftungssumme 250.000 € (REQ-118), Festpreisbindung über 48 Monate (REQ-115) und Lagerhaftpflichtversicherung 5 Mio. € (REQ-119) müssen vor Angebotsabgabe geklärt sein.
                - listitem [ref=f4e472]:
                  - paragraph [ref=f4e473]:
                    - strong [ref=f4e474]: "Kapazitätsnachweis erbringen:"
                    - text: Operations Manager bestätigt schriftlich, dass 2.300 Pickpositionen/Tag im Durchschnitt und 3.800 Pickpositionen/Tag in Spitzenzeiten (REQ-053, REQ-054) sowie 12.400 Palettenstellplätze (REQ-104) verfügbar sind.
                - listitem [ref=f4e475]:
                  - paragraph [ref=f4e476]:
                    - strong [ref=f4e477]: "Kundenfragen priorisiert stellen:"
                    - text: Die 17 Klärungsfragen (insbesondere zur Zahlendifferenz Palettenstellplätze, zur Cut-off-Zeit 14:00 vs. 15:00 Uhr und zu den kommerziellen Schwellenwerten) müssen vor Angebotserstellung beantwortet sein.
                - listitem [ref=f4e478]:
                  - paragraph [ref=f4e479]:
                    - strong [ref=f4e480]: "Preisannahmen dokumentieren:"
                    - text: Falls Kundenfragen bis Angebotsfrist nicht beantwortet werden, Angebot unter Vorbehalt mit expliziten Annahmen zu Gefahrgut-Ausschluss, 15:00-Uhr-Cut-off und Kapazitätsgrenzen abgeben.
