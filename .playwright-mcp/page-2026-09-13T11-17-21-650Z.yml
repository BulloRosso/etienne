              - heading "Risiken & Abweichungen" [level=2] [ref=f4e322]
              - paragraph [ref=f4e323]:
                - strong [ref=f4e324]: "REQ-061 (Gefahrgutlagerung Klasse 3):"
                - text: "Der Katalog schließt die Lagerung von Gefahrgut der Klassen 1–3 explizit aus (SVC-002). Die Anforderung verlangt jedoch ein separates Gefahrgutlager gemäß TRGS 510 für entzündbare Flüssigkeiten (Reinigungsmittel). Da dies eine MUSS-Anforderung ist, besteht hohes Ausschlussrisiko. Konsequenz: Ohne Gefahrgutfähigkeit ist das Angebot nicht wettbewerbsfähig; Prüfung, ob Gefahrgut durch Subunternehmer abgedeckt werden kann."
              - paragraph [ref=f4e325]:
                - strong [ref=f4e326]: "REQ-117 (Malus-Regelung Inventurgenauigkeit):"
                - text: "Die Anforderung verlangt einen Malus von 2 % der Monatsvergütung bei Unterschreitung von 99,5 % Inventurgenauigkeit in zwei aufeinanderfolgenden Monaten. Unser Service SVC-002 garantiert 99,7 %, jedoch fehlt die vertragliche Akzeptanz der Pönale-Regelung. Konsequenz: Ohne Zustimmung zur Malus-Klausel droht Ausschluss; Geschäftsführung muss Haftungsrisiko bewerten."
              - paragraph [ref=f4e327]:
                - strong [ref=f4e328]: "REQ-063, REQ-064, REQ-065 (Cut-off-Zeit 14:00 vs. 15:00 Uhr):"
                - text: "Unser Same-Day-Versand gilt für Aufträge bis 15:00 Uhr, die Ausschreibung fordert 14:00 Uhr für Kommissionierung, Verpackung und KEP-Übergabe. Abweichung: 1 Stunde. Konsequenz: Bei MUSS-Anforderungen Zuschlagsrisiko, da Frist nicht exakt eingehalten wird; Klärung, ob 15:00-Uhr-Frist akzeptabel ist oder Prozessanpassung erforderlich."
              - table [ref=f4e329]:
                - rowgroup [ref=f4e330]:
                  - row [ref=f4e331]:
                    - columnheader "Kennzahl" [ref=f4e332]
                    - columnheader "Leistungsbeschreibung" [ref=f4e333]
                    - columnheader "Mengengerüst" [ref=f4e334]
                    - columnheader "Abweichung" [ref=f4e335]
                    - columnheader "Status" [ref=f4e336]
                - rowgroup [ref=f4e337]:
                  - row [ref=f4e338]:
                    - cell "Mengen › Palettenstellplätze › Anzahl (REQ-104)" [ref=f4e339]
                    - cell "12400 Palettenstellplätze" [ref=f4e340]
                    - cell "12.000 (Mengen!B2)" [ref=f4e341]
                    - cell "3,3 %" [ref=f4e342]
                    - cell "beim Kunden zu klären" [ref=f4e343]
              - paragraph [ref=f4e344]: "MUSS-Anforderungen ohne Entsprechung im Leistungskatalog:"
              - list [ref=f4e345]:
                - listitem [ref=f4e346]:
                  - strong [ref=f4e347]: REQ-053
                  - text: — Der Auftragnehmer muss im Durchschnitt 2.300 Pickpositionen pro Tag kommissionieren.
                - listitem [ref=f4e348]:
                  - strong [ref=f4e349]: REQ-054
                  - text: — Während der Spitzenzeiten (November/Dezember) muss der Auftragnehmer bis zu 3.800 Pickpositionen pro Tag kommissionieren.
                - listitem [ref=f4e350]:
                  - strong [ref=f4e351]: REQ-061
                  - text: — Der Auftragnehmer muss Gefahrgüter der Klasse 3 (entzündbare Flüssigkeiten, z. B. Reinigungsmittel) in einem separaten Gefahrgutlager gemäß TRGS 510 lagern.
                - listitem [ref=f4e352]:
                  - strong [ref=f4e353]: REQ-065
                  - text: — Wenn Aufträge bis 14:00 Uhr im Lagerverwaltungssystem freigegeben werden, muss der Auftragnehmer diese am selben Werktag an den Paketdienst übergeben.
                - listitem [ref=f4e354]:
                  - strong [ref=f4e355]: REQ-069
                  - text: — Der Vertrag muss am 01.04.2027 beginnen.
                - listitem [ref=f4e356]:
                  - strong [ref=f4e357]: REQ-070
                  - text: — Der Vertrag muss eine feste Laufzeit von 48 Monaten haben.
                - listitem [ref=f4e358]:
                  - strong [ref=f4e359]: REQ-071
                  - text: — Wenn die Termintreue über ein Quartal 99 % überschreitet, muss der Auftragnehmer einen Bonus von 1 % der Quartalsvergütung erhalten.
                - listitem [ref=f4e360]:
                  - strong [ref=f4e361]: REQ-073
                  - text: — Vor Betriebsstart muss der Auftragnehmer die Mitarbeitenden in einer Schulung von 3 Tagen in die Prozesse und das Lagerverwaltungssystem einweisen.
                - listitem [ref=f4e362]:
                  - strong [ref=f4e363]: REQ-074
                  - text: — Der Bieter muss das Angebot bis zum 15.11.2026, 12:00 Uhr elektronisch über die Vergabeplattform einreichen.
                - listitem [ref=f4e364]:
                  - strong [ref=f4e365]: REQ-104
                  - text: — Der Auftragnehmer muss im Hochregallager und im Blocklager insgesamt 12.400 Palettenstellplätze vorhalten.
                - listitem [ref=f4e366]:
                  - strong [ref=f4e367]: REQ-115
                  - text: — Der Auftragnehmer muss die Preise für die Vertragslaufzeit fest anbieten.
                - listitem [ref=f4e368]:
                  - strong [ref=f4e369]: REQ-117
                  - text: — Wenn die Inventurgenauigkeit in zwei aufeinanderfolgenden Monaten unter 99,5 % liegt, muss der Auftragnehmer einen Malus von 2 % der Monatsvergütung leisten.
                - listitem [ref=f4e370]:
                  - strong [ref=f4e371]: REQ-118
                  - text: — Der Auftragnehmer muss für Bestandsdifferenzen oberhalb der vereinbarten Inventurgenauigkeit bis zu einer Höhe von 250.000 € je Vertragsjahr haften.
                - listitem [ref=f4e372]:
                  - strong [ref=f4e373]: REQ-119
                  - text: — Der Auftragnehmer muss eine Lagerhaftpflichtversicherung mit einer Deckungssumme von mindestens 5 Mio. € nachweisen.
              - heading "Klärungsbedarf beim Kunden" [level=2] [ref=f4e374]
              - paragraph [ref=f4e375]: "Diese Fragen gehen als Bieterfragen an den Kunden. Nur was hier steht, wird gefragt:"
              - list [ref=f4e376]:
                - listitem [ref=f4e377]:
                  - text: "Zu „Mengen › Palettenstellplätze › Anzahl“: Die Leistungsbeschreibung nennt 12400 Palettenstellplätze, das Mengengerüst (Mengen!B2) nennt 12000. Welcher Wert ist verbindlich?"
                  - emphasis [ref=f4e378]: (REQ-104)
                - listitem [ref=f4e379]:
                  - text: "Bitte bestätigen Sie den gültigen Wert für „Mengen › Palettenstellplätze › Anzahl“: die Leistungsbeschreibung nennt 12400 Palettenstellplätze, das Mengengerüst (Mengen!B2) nennt 12.000."
                  - emphasis [ref=f4e380]: (REQ-104, Mengen!B2)
                - listitem [ref=f4e381]:
                  - text: "Zu Abschnitt 4 Lagerung und Bestandsführung: Welche maximale Latenz ist für die Echtzeit-Abrufbarkeit der Bestände im Lagerverwaltungssystem zulässig?"
                  - emphasis [ref=f4e382]: (REQ-105)
                - listitem [ref=f4e383]:
                  - text: "Zu Abschnitt 5 Kommissionierung und Warenausgang: Unter welchen Bedingungen sollen Mehrfachbestellungen eines Kunden zu einer Sendung konsolidiert werden (z.B. innerhalb welches Zeitfensters, bei gleichem Versandziel)?"
                  - emphasis [ref=f4e384]: (REQ-106)
                - listitem [ref=f4e385]:
                  - text: "Zu Abschnitt 5 Kommissionierung und Warenausgang: Innerhalb welcher Frist muss die elektronische Meldung des Warenausgangs mit Sendungsnummer an den Auftraggeber erfolgen?"
                  - emphasis [ref=f4e386]: (REQ-107)
                - listitem [ref=f4e387]:
                  - text: "Zu Abschnitt 6 Retourenabwicklung: Innerhalb welcher Frist müssen Retouren nach Eingang bearbeitet werden?"
                  - emphasis [ref=f4e388]: (REQ-108)
                - listitem [ref=f4e389]:
                  - text: "Zu Abschnitt 6 Retourenabwicklung: Innerhalb welcher Frist müssen geprüfte Retouren wieder eingelagert oder verschrottet werden?"
                  - emphasis [ref=f4e390]: (REQ-109)
                - listitem [ref=f4e391]:
                  - text: "Zu Abschnitt 7 IT-Anbindung: Welche Art von Schnittstelle ist für die Anbindung des Lagerverwaltungssystems an SAP S/4HANA vorgesehen (z.B. IDoc, REST-API, Batch-Datei) und welche technischen Spezifikationen sind zu beachten?"
                  - emphasis [ref=f4e392]: (REQ-110)
                - listitem [ref=f4e393]:
                  - text: "Zu Abschnitt 7 IT-Anbindung: Ist die Nutzung des Lagerverwaltungssystems des Auftraggebers eine vom Auftragnehmer wählbare Alternative oder eine vom Auftraggeber vorgegebene Option?"
                  - emphasis [ref=f4e394]: (REQ-111)
                - listitem [ref=f4e395]:
                  - text: "Zu Abschnitt 7 IT-Anbindung: Welche Aufbewahrungsfrist ist für die revisionssichere Protokollierung der Buchungen einzuhalten?"
                  - emphasis [ref=f4e396]: (REQ-112)
                - listitem [ref=f4e397]:
                  - text: "Zu Abschnitt 8 Service-Level und Berichtswesen: Welche Ereignisse sind als 'Störungen des Lagerbetriebs' zu klassifizieren und unterliegen der 2-Stunden-Meldepflicht? Gibt es eine Kategorisierung nach Schweregrad?"
                  - emphasis [ref=f4e398]: (REQ-113)
                - listitem [ref=f4e399]:
                  - text: "Zu Abschnitt 8 Service-Level und Berichtswesen: In welcher Form und mit welchem Detaillierungsgrad sind die quartalsweisen Vorschläge zur Prozessoptimierung einzureichen?"
                  - emphasis [ref=f4e400]: (REQ-114)
                - listitem [ref=f4e401]:
                  - text: "Zu Abschnitt 2 Vergütung: Welche Vertragslaufzeit ist für die Festpreisbindung maßgeblich?"
                  - emphasis [ref=f4e402]: (REQ-115)
                - listitem [ref=f4e403]:
                  - text: "Zu Abschnitt 2 Vergütung: Welcher Tariflohn ist für die Preisanpassungsklausel maßgeblich und wie wird die prozentuale Änderung berechnet?"
                  - emphasis [ref=f4e404]: (REQ-116)
                - listitem [ref=f4e405]:
                  - text: "Zu Abschnitt 3 Bonus-Malus: Bezieht sich der Malus von 2 % der Monatsvergütung auf die Vergütung des zweiten Monats der Unterschreitung oder auf beide Monate, in denen die Inventurgenauigkeit unter 99,5 % lag?"
                  - emphasis [ref=f4e406]: (REQ-117)
                - listitem [ref=f4e407]:
                  - text: "Zu Abschnitt Vergabe- und Vertragsbedingungen > 5 Haftung und Versicherung: Welche Inventurgenauigkeit ist vertraglich vereinbart, ab deren Überschreitung die Haftung für Bestandsdifferenzen greift?"
                  - emphasis [ref=f4e408]: (REQ-118)
                - listitem [ref=f4e409]:
                  - text: "Zu Abschnitt Vergabe- und Vertragsbedingungen > 5 Haftung und Versicherung: Bis wann muss der Nachweis der Lagerhaftpflichtversicherung mit einer Deckungssumme von mindestens 5 Mio. € erbracht werden?"
                  - emphasis [ref=f4e410]: (REQ-119)
