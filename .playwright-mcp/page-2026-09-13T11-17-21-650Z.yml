              - blockquote [ref=f4e192]:
                - paragraph [ref=f4e193]:
                  - text: ⚠️
                  - strong [ref=f4e194]: Analyse mit Vorbehalten
                  - text: — 17 Klärungsfrage(n) an den Kunden, 11 interne Rückfrage(n), 0 ungeklärte(r) Zahlenwiderspruch/-sprüche. Die Bewertung gilt unter diesen Vorbehalten.
              - heading "Management Summary" [level=2] [ref=f4e195]
              - paragraph [ref=f4e196]: "Die Nordland Handels AG schreibt den Vollbetrieb eines Logistikzentrums Nord mit 12.400 Palettenstellplätzen aus. Unser Leistungskatalog deckt die Kernprozesse Wareneingang, Bestandsführung, Kommissionierung und Retouren ab; die Erfüllung der Anforderungen ist jedoch mit erheblichen Vorbehalten verbunden: Von 38 Anforderungen sind 11 als NEEDS_INPUT klassifiziert, 12 nur teilweise erfüllbar (PARTIAL) und 2 nicht erfüllbar (NON_COMPLIANT). 17 Kundenfragen und 11 interne Klärungspunkte sind offen."
              - paragraph [ref=f4e197]: Die beiden kritischen Ausschlusskriterien sind REQ-061 (Gefahrgutlagerung Klasse 3 nach TRGS 510, die unser Katalog explizit ausschließt) und REQ-117 (Malus-Regelung bei Inventurgenauigkeit unter 99,5 %, für die keine vertragliche Akzeptanz dokumentiert ist). Hinzu kommen 14 ungemappte MUSS-Anforderungen, darunter kommerzielle Bedingungen (Festpreise über 48 Monate, Vertragsbeginn 01.04.2027, Haftungssummen) und operative Kapazitätsfragen (2.300 bzw. 3.800 Pickpositionen/Tag).
              - paragraph [ref=f4e198]: Eine Angebotsabgabe ist erst nach Klärung der Gefahrgutanforderung und der kommerziellen Rahmenbedingungen möglich. Die Zahlendifferenz zwischen Leistungsbeschreibung (12.400 Stellplätze) und Mengengerüst (12.000 Stellplätze) wurde vom Kunden bereits als Klärungsbedarf identifiziert.
              - heading "Erfüllungsgrad je Leistungsbereich" [level=2] [ref=f4e199]
              - paragraph [ref=f4e200]: Prozesse (Wareneingang, Kommissionierung, Retouren) sind überwiegend abgedeckt, jedoch mit Abweichungen bei Cut-off-Zeiten (15:00 statt 14:00 Uhr). Kommerzielle und rechtliche Anforderungen (7 von 8) erfordern interne Entscheidungen. Die Sicherheitsanforderung REQ-061 ist nicht erfüllbar.
