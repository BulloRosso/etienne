              - heading "Risiken & Abweichungen" [level=2] [ref=f13e324]
              - paragraph [ref=f13e325]:
                - strong [ref=f13e326]: "REQ-122 (Temperaturgeführte Lagerung 2–8 °C, 1.200 m²):"
                - text: "MUSS-Anforderung mit PARTIAL-Verdikt. Die Kühltechnik muss laut SVC-003 vom Auftraggeber gestellt werden, während die Ausschreibung verlangt, dass der Auftragnehmer die Kühlzone betreibt. Zudem fehlt jegliche Angabe zur verfügbaren Kühlfläche (1.200 m² gefordert). Risiko: Ausschluss, wenn andere Bieter die Kühltechnik selbst bereitstellen und die Betreiberverantwortung vollständig übernehmen."
              - paragraph [ref=f13e327]:
                - strong [ref=f13e328]: "REQ-133 (Same-Day-Versand bis 14:00 Uhr):"
                - text: "MUSS-Anforderung mit PARTIAL-Verdikt. SVC-004 garantiert Same-Day-Versand nur für Aufträge bis 15:00 Uhr, die Ausschreibung fordert 14:00 Uhr. Die 1-Stunden-Differenz beim Cut-off bedeutet, dass Aufträge zwischen 14:00 und 15:00 Uhr nicht fristgerecht bearbeitet würden. Risiko: Nichterfüllung einer zwingenden Leistungsanforderung mit Ausschlussgefahr."
              - paragraph [ref=f13e329]:
                - strong [ref=f13e330]: "15 unmapped mandatory requirements:"
                - text: "Kritische Infrastruktur- und Vertragsanforderungen ohne Katalogzuordnung, darunter die Bereitstellung von 18.500 m² Hallenfläche (REQ-121), 12.400 Palettenstellplätzen (REQ-145), Gefahrgutlagerung nach TRGS 510 (REQ-131), Vertragslaufzeit 48 Monate (REQ-138), Preisfestschreibung (REQ-139), Haftung bis 250.000 € (REQ-158) und Lagerhaftpflichtversicherung 5 Mio. € (REQ-159). Risiko: Ohne Nachweis dieser Grundvoraussetzungen ist eine Angebotsabgabe nicht möglich."
