              - paragraph [ref=f13e352]: "MUSS-Anforderungen ohne Entsprechung im Leistungskatalog:"
              - list [ref=f13e353]:
                - listitem [ref=f13e354]:
                  - strong [ref=f13e355]: REQ-121
                  - text: — Der Auftragnehmer muss eine Lagerfläche von 18.500 m² Hallenfläche bereitstellen.
                - listitem [ref=f13e356]:
                  - strong [ref=f13e357]: REQ-123
                  - text: — Der Auftragnehmer muss im Durchschnitt 2.300 Pickpositionen pro Tag kommissionieren.
                - listitem [ref=f13e358]:
                  - strong [ref=f13e359]: REQ-124
                  - text: — Während der Spitzenzeiten (November/Dezember) muss der Auftragnehmer bis zu 3.800 Pickpositionen pro Tag kommissionieren.
                - listitem [ref=f13e360]:
                  - strong [ref=f13e361]: REQ-131
                  - text: — Der Auftragnehmer muss Gefahrgüter der Klasse 3 (entzündbare Flüssigkeiten, z. B. Reinigungsmittel) in einem separaten Gefahrgutlager gemäß TRGS 510 lagern.
                - listitem [ref=f13e362]:
                  - strong [ref=f13e363]: REQ-137
                  - text: — Der Vertrag muss am 01.04.2027 beginnen.
                - listitem [ref=f13e364]:
                  - strong [ref=f13e365]: REQ-138
                  - text: — Der Vertrag muss eine feste Laufzeit von 48 Monaten haben.
                - listitem [ref=f13e366]:
                  - strong [ref=f13e367]: REQ-139
                  - text: — Der Auftragnehmer muss die Preise für die Vertragslaufzeit fest anbieten.
                - listitem [ref=f13e368]:
                  - strong [ref=f13e369]: REQ-140
                  - text: — Wenn die Inventurgenauigkeit in zwei aufeinanderfolgenden Monaten unter 99,5 % liegt, muss der Auftragnehmer einen Malus von 2 % der Monatsvergütung leisten.
                - listitem [ref=f13e370]:
                  - strong [ref=f13e371]: REQ-141
                  - text: — Wenn die Termintreue über ein Quartal 99 % überschreitet, muss der Auftragnehmer einen Bonus von 1 % der Quartalsvergütung erhalten.
                - listitem [ref=f13e372]:
                  - strong [ref=f13e373]: REQ-143
                  - text: — Vor Betriebsstart muss der Auftragnehmer die Mitarbeitenden in einer Schulung von 3 Tagen in die Prozesse und das Lagerverwaltungssystem einweisen.
                - listitem [ref=f13e374]:
                  - strong [ref=f13e375]: REQ-144
                  - text: — Der Bieter muss das Angebot bis zum 15.11.2026, 12:00 Uhr elektronisch über die Vergabeplattform einreichen.
                - listitem [ref=f13e376]:
                  - strong [ref=f13e377]: REQ-145
                  - text: — Der Auftragnehmer muss im Hochregallager und im Blocklager insgesamt 12.400 Palettenstellplätze vorhalten.
                - listitem [ref=f13e378]:
                  - strong [ref=f13e379]: REQ-155
                  - text: — Der Auftragnehmer muss Störungen des Lagerbetriebs innerhalb von 2 Stunden dem Ansprechpartner des Auftraggebers melden.
                - listitem [ref=f13e380]:
                  - strong [ref=f13e381]: REQ-158
                  - text: — Der Auftragnehmer muss für Bestandsdifferenzen oberhalb der vereinbarten Inventurgenauigkeit bis zu einer Höhe von 250.000 € je Vertragsjahr haften.
                - listitem [ref=f13e382]:
                  - strong [ref=f13e383]: REQ-159
                  - text: — Der Auftragnehmer muss eine Lagerhaftpflichtversicherung mit einer Deckungssumme von mindestens 5 Mio. € nachweisen.
              - heading "Klärungsbedarf beim Kunden" [level=2] [ref=f13e384]
              - paragraph [ref=f13e385]: "Diese Fragen gehen als Bieterfragen an den Kunden. Nur was hier steht, wird gefragt:"
              - list [ref=f13e386]:
                - listitem [ref=f13e387]:
                  - text: "Zu „Mengen › Palettenstellplätze › Anzahl“: Die Leistungsbeschreibung nennt 12400 Palettenstellplätze, das Mengengerüst (Mengen!B2) nennt 12000. Welcher Wert ist verbindlich?"
                  - emphasis [ref=f13e388]: (REQ-145)
                - listitem [ref=f13e389]:
                  - text: "Zu Abschnitt 4 Lagerung und Bestandsführung: Welche maximale Latenz ist für die Echtzeit-Abrufbarkeit der Bestände im Lagerverwaltungssystem zulässig?"
                  - emphasis [ref=f13e390]: (REQ-147)
                - listitem [ref=f13e391]:
                  - text: "Zu Abschnitt 5 Kommissionierung und Warenausgang: Unter welchen Bedingungen sollen Mehrfachbestellungen eines Kunden zu einer Sendung konsolidiert werden (z. B. innerhalb welchen Zeitraums, bei gleicher Lieferadresse)?"
                  - emphasis [ref=f13e392]: (REQ-148)
                - listitem [ref=f13e393]:
                  - text: "Zu Abschnitt 5 Kommissionierung und Warenausgang: Innerhalb welcher Frist muss die elektronische Meldung des Warenausgangs mit Sendungsnummer an den Auftraggeber erfolgen?"
                  - emphasis [ref=f13e394]: (REQ-149)
                - listitem [ref=f13e395]:
                  - text: "Zu Abschnitt 6 Retourenabwicklung: Innerhalb welcher Frist müssen Retouren nach Eingang bearbeitet werden?"
                  - emphasis [ref=f13e396]: (REQ-150)
                - listitem [ref=f13e397]:
                  - text: "Zu Abschnitt 6 Retourenabwicklung: Innerhalb welcher Frist müssen geprüfte Retouren wieder eingelagert oder verschrottet werden?"
                  - emphasis [ref=f13e398]: (REQ-151)
                - listitem [ref=f13e399]:
                  - text: "Zu Abschnitt 7 IT-Anbindung: Welche Art von Schnittstelle ist für die Anbindung des Lagerverwaltungssystems an SAP S/4HANA vorgesehen (z.B. IDoc, REST-API, Batch-Datei) und welche technischen Spezifikationen sind zu beachten?"
                  - emphasis [ref=f13e400]: (REQ-152)
                - listitem [ref=f13e401]:
                  - text: "Zu Abschnitt 7 IT-Anbindung: Ist die Nutzung des Lagerverwaltungssystems des Auftraggebers eine Option, die der Auftragnehmer wählen kann, oder wird diese Entscheidung vom Auftraggeber getroffen?"
                  - emphasis [ref=f13e402]: (REQ-153)
                - listitem [ref=f13e403]:
                  - text: "Zu Abschnitt 7 IT-Anbindung: Für welchen Zeitraum müssen die Buchungen revisionssicher aufbewahrt werden?"
                  - emphasis [ref=f13e404]: (REQ-154)
                - listitem [ref=f13e405]:
                  - text: "Zu Abschnitt 8 Service-Level und Berichtswesen: Welche Ereignisse sind als 'Störungen des Lagerbetriebs' zu klassifizieren und unterliegen der 2-Stunden-Meldefrist?"
                  - emphasis [ref=f13e406]: (REQ-155)
                - listitem [ref=f13e407]:
                  - text: "Zu Abschnitt 8 Service-Level und Berichtswesen: In welcher Form und in welchem Umfang sind die quartalsweisen Vorschläge zur Prozessoptimierung einzureichen?"
                  - emphasis [ref=f13e408]: (REQ-156)
                - listitem [ref=f13e409]:
                  - text: "Zu Abschnitt Vergabe- und Vertragsbedingungen > 2 Vergütung: Welcher Tariflohn ist für die Preisanpassungsklausel maßgeblich (Branche, Region, konkreter Tarifvertrag)?"
                  - emphasis [ref=f13e410]: (REQ-157)
                - listitem [ref=f13e411]:
                  - text: "Zu Abschnitt 5 Haftung und Versicherung: Welche Inventurgenauigkeit ist vertraglich vereinbart, ab deren Überschreitung die Haftung für Bestandsdifferenzen greift?"
                  - emphasis [ref=f13e412]: (REQ-158)
                - listitem [ref=f13e413]:
                  - text: "Zu Abschnitt 5 Haftung und Versicherung: Zu welchem Zeitpunkt und in welcher Form ist der Nachweis der Lagerhaftpflichtversicherung zu erbringen (z. B. bei Vertragsschluss, jährlich, als Versicherungsschein)?"
                  - emphasis [ref=f13e414]: (REQ-159)
              - heading "Interne offene Punkte" [level=2] [ref=f13e415]
              - paragraph [ref=f13e416]: "Was intern entschieden oder beschafft werden muss, mit verantwortlicher Rolle:"
              - table [ref=f13e417]:
                - rowgroup [ref=f13e418]:
                  - row [ref=f13e419]:
                    - columnheader "Anforderung" [ref=f13e420]
                    - columnheader "Frage" [ref=f13e421]
                    - columnheader "Verantwortlich" [ref=f13e422]
                - rowgroup [ref=f13e423]:
                  - row [ref=f13e424]:
                    - cell "REQ-120" [ref=f13e425]
                    - cell "Bieten wir Inbound-Handling, Bestandsführung mit permanenter Inventur und Returns Management an? Können wir bestätigen, dass alle fünf Prozessschritte (Wareneingang, Lagerung, Kommissionierung, Warenausgang, Retourenabwicklung) für das Sortiment Haushaltswaren und Elektrokleingeräte abgedeckt sind?" [ref=f13e426]
                    - cell "Operations Lead" [ref=f13e427]
                  - row [ref=f13e428]:
                    - cell "REQ-121" [ref=f13e429]
                    - cell "Verfügt das Unternehmen über mindestens 18.500 m² Hallenfläche, davon mindestens 1.200 m² als temperaturgeführte Kühlzone (2–8 °C)? Bitte Standort, Gesamtfläche und Kühlzonenfläche konkret benennen." [ref=f13e430]
                    - cell "Logistics Operations Manager" [ref=f13e431]
                  - row [ref=f13e432]:
                    - cell "REQ-123" [ref=f13e433]
                    - 'cell "Welche maximale Tageskapazität (Pickpositionen/Tag) kann der Service Order Fulfillment (Picking & Packing) im Durchschnitt und in Spitzenzeiten leisten? Anforderung: durchschnittlich 2.300, Spitze bis 3.800 Pickpositionen/Tag." [ref=f13e434]'
                    - cell "Operations Manager" [ref=f13e435]
                  - row [ref=f13e436]:
                    - cell "REQ-124" [ref=f13e437]
                    - cell "Welche maximale Tageskapazität (Pickpositionen/Tag) kann unser Order Fulfillment Service (SVC-004) während Spitzenzeiten (November/Dezember) mit Peak-Personal leisten? Können wir 3.800 Pickpositionen/Tag garantieren?" [ref=f13e438]
                    - cell "Operations Manager" [ref=f13e439]
                  - row [ref=f13e440]:
                    - cell "REQ-131" [ref=f13e441]
                    - cell "Verfügt das Unternehmen über ein separates Gefahrgutlager gemäß TRGS 510 für die Lagerung von Gefahrgütern der Klasse 3 (entzündbare Flüssigkeiten wie Reinigungsmittel)? Falls ja, welche Zulassungen und Nachweise liegen vor?" [ref=f13e442]
                    - cell "Lagerleiter" [ref=f13e443]
                  - row [ref=f13e444]:
                    - cell "REQ-137" [ref=f13e445]
                    - cell "Kann das Unternehmen den Vertragsbeginn verbindlich auf den 01.04.2027 festlegen und alle erforderlichen Vorbereitungen (insbesondere Betriebsübernahme mit 8-wöchiger Vorlaufzeit für Personalunterlagen gemäß SVC-009) bis zu diesem Datum abschließen?" [ref=f13e446]
                    - cell "Vertragsmanagement" [ref=f13e447]
                  - row [ref=f13e448]:
                    - cell "REQ-138" [ref=f13e449]
                    - cell "Ist das Unternehmen bereit, einen Vertrag mit fester Laufzeit von 48 Monaten (01.04.2027 bis 31.03.2031) ohne ordentliche Kündigungsmöglichkeit abzuschließen?" [ref=f13e450]
                    - cell "Vertriebsleitung" [ref=f13e451]
                  - row [ref=f13e452]:
                    - cell "REQ-139" [ref=f13e453]
                    - cell "Bietet das Unternehmen feste Preise für die gesamte Vertragslaufzeit an, und sind Preisanpassungen ausschließlich bei Tariflohnänderungen über 3 % vorgesehen, oder gibt es andere Indexierungsklauseln in den Standardverträgen?" [ref=f13e454]
                    - cell "Commercial Manager" [ref=f13e455]
                  - row [ref=f13e456]:
                    - cell "REQ-140" [ref=f13e457]
                    - cell "Akzeptiert das Unternehmen die Malus-Regelung von 2 % der Monatsvergütung bei Unterschreitung der Inventurgenauigkeit von 99,5 % in zwei aufeinanderfolgenden Monaten? Falls ja, muss dies vertraglich fixiert werden." [ref=f13e458]
                    - cell "Commercial Manager" [ref=f13e459]
                  - row [ref=f13e460]:
                    - cell "REQ-141" [ref=f13e461]
                    - cell "Ist das Unternehmen bereit, eine Bonusvereinbarung von 1 % der Quartalsvergütung bei Überschreitung von 99 % Termintreue über ein Quartal in den Vertrag aufzunehmen? Welche vertraglichen und kaufmännischen Rahmenbedingungen müssen dafür geschaffen werden?" [ref=f13e462]
                    - cell "Commercial Manager" [ref=f13e463]
                  - row [ref=f13e464]:
                    - cell "REQ-144" [ref=f13e465]
                    - cell "Verfügt das Unternehmen über die technischen und organisatorischen Voraussetzungen, um Angebote elektronisch über die Vergabeplattform bis zum 15.11.2026, 12:00 Uhr einzureichen? Welche Prozesse und Systeme sind dafür etabliert?" [ref=f13e466]
                    - cell "Bid Manager" [ref=f13e467]
                  - row [ref=f13e468]:
                    - cell "REQ-145" [ref=f13e469]
                    - cell "Verfügt das Unternehmen über Hochregallager und Blocklager mit insgesamt mindestens 12.400 Palettenstellplätzen? Falls ja, bitte genaue Kapazitätsangaben (Hochregallager und Blocklager getrennt) sowie technische Spezifikationen der Lagerinfrastruktur bereitstellen." [ref=f13e470]
                    - cell "Warehouse Operations Manager" [ref=f13e471]
                  - row [ref=f13e472]:
                    - cell "REQ-155" [ref=f13e473]
                    - cell "Existiert ein dokumentierter Prozess zur Meldung von Störungen des Lagerbetriebs an den Auftraggeber innerhalb von 2 Stunden? Falls ja, welche Störungsarten sind abgedeckt und wie erfolgt die Eskalation?" [ref=f13e474]
                    - cell "Operations Manager" [ref=f13e475]
                  - row [ref=f13e476]:
                    - cell "REQ-157" [ref=f13e477]
                    - cell "Akzeptiert das Unternehmen eine Preisbindung für die Vertragslaufzeit mit Anpassungsrecht nur bei Tariflohnänderungen >3 %? Welche Preisanpassungsklauseln sind in Standardverträgen vorgesehen?" [ref=f13e478]
                    - cell "Commercial Manager" [ref=f13e479]
                  - row [ref=f13e480]:
                    - cell "REQ-158" [ref=f13e481]
                    - cell "Ist der Auftragnehmer bereit, für Bestandsdifferenzen oberhalb der vereinbarten Inventurgenauigkeit (99,7 %) eine vertragliche Haftung bis zu 250.000 € je Vertragsjahr zu übernehmen? Falls ja, welche Bedingungen gelten für diese Haftung?" [ref=f13e482]
                    - cell "Commercial Director" [ref=f13e483]
                  - row [ref=f13e484]:
                    - cell "REQ-159" [ref=f13e485]
                    - cell "Verfügt das Unternehmen über eine Lagerhaftpflichtversicherung mit einer Deckungssumme von mindestens 5 Mio. €? Falls ja, bitte Versicherungsnachweis (Police oder Bestätigung des Versicherers) beifügen." [ref=f13e486]
                    - cell "Geschäftsführung oder Versicherungsbeauftragter" [ref=f13e487]
              - heading "Empfehlung / nächste Schritte" [level=2] [ref=f13e488]
              - list [ref=f13e489]:
                - listitem [ref=f13e490]:
                  - paragraph [ref=f13e491]:
                    - strong [ref=f13e492]: "Klärung Infrastrukturkapazitäten (Operations Lead, Warehouse Operations Manager):"
                    - text: Vor Angebotsabgabe verbindlich bestätigen, ob 18.500 m² Hallenfläche (davon 1.200 m² Kühlzone 2–8 °C), 12.400 Palettenstellplätze und ein TRGS 510-konformes Gefahrgutlager verfügbar sind. Ohne diese Nachweise ist keine Angebotsabgabe möglich.
                - listitem [ref=f13e493]:
                  - paragraph [ref=f13e494]:
                    - strong [ref=f13e495]: "Kommerzielle Bedingungen klären (Commercial Manager, Geschäftsführung):"
                    - text: Vertragslaufzeit 48 Monate fest, Preisfestschreibung mit Anpassung nur bei Tariflohnänderung >3 %, Malus-/Bonusregelungen, Haftung bis 250.000 € und Lagerhaftpflichtversicherung 5 Mio. € intern entscheiden und mit Rechtsabteilung abstimmen.
                - listitem [ref=f13e496]:
                  - paragraph [ref=f13e497]:
                    - strong [ref=f13e498]: "Kundenfragen einreichen (Bid Manager):"
                    - text: Alle 14 Klärungsfragen bis spätestens 4 Wochen vor Angebotsfrist (15.11.2026) über die Vergabeplattform stellen, insbesondere die Zahlenwidersprüche bei Palettenstellplätzen (12.400 vs. 12.000) und Wareneingangsbuchung (4 vs. 6 Stunden).
                - listitem [ref=f13e499]:
                  - paragraph [ref=f13e500]:
                    - strong [ref=f13e501]: "Abweichungen bewerten (Operations Manager):"
                    - text: Cut-off-Zeit 15:00 statt 14:00 Uhr (REQ-133) und Kühlzonenbetrieb mit Auftraggeber-Kühltechnik (REQ-122) als Abweichungen im Angebot transparent darstellen und Preisauswirkungen kalkulieren. Alternativ prüfen, ob betriebliche Anpassungen (früherer Schichtbeginn, eigene Kühltechnik) möglich sind.
                - listitem [ref=f13e502]:
                  - paragraph [ref=f13e503]:
                    - strong [ref=f13e504]: "Angebotsentscheidung (Geschäftsführung):"
                    - text: Angebotsabgabe nur unter Vorbehalt der vollständigen Klärung aller 14 Kundenfragen und 16 internen Punkte. Ohne Bestätigung der Infrastrukturkapazitäten und kommerziellen Bedingungen besteht hohes Risiko einer nicht kalkulierbaren oder nicht erfüllbaren Verpflichtung.
