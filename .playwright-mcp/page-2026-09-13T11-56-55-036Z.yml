              - heading "Management-Analyse Ausschreibung" [level=1] [ref=f13e191]
              - blockquote [ref=f13e192]:
                - paragraph [ref=f13e193]:
                  - text: ⚠️
                  - strong [ref=f13e194]: Analyse mit Vorbehalten
                  - text: — 14 Klärungsfrage(n) an den Kunden, 16 interne Rückfrage(n), 0 ungeklärte(r) Zahlenwiderspruch/-sprüche. Die Bewertung gilt unter diesen Vorbehalten.
              - heading "Management Summary" [level=2] [ref=f13e195]
              - paragraph [ref=f13e196]: Die Ausschreibung der Nordland Handels AG umfasst den Vollbetrieb eines Logistikzentrums mit 18.500 m² Hallenfläche (davon 1.200 m² temperaturgeführt 2–8 °C) für das Sortiment Haushaltswaren und Elektrokleingeräte. Der Vertrag beginnt am 01.04.2027 mit einer festen Laufzeit von 48 Monaten und verlangt die Übernahme von 62 Mitarbeitenden nach § 613a BGB.
              - paragraph [ref=f13e197]: Unser Leistungskatalog deckt die operativen Kernprozesse Wareneingang, Kommissionierung, Warenausgang und Retourenabwicklung ab. Die geforderten Leistungskennzahlen (Inventurgenauigkeit 99,7 %, Kommissionierfehlerquote <0,2 %) erfüllen oder übertreffen die Anforderungen. Kritisch sind jedoch 15 MUSS-Anforderungen ohne Katalogzuordnung, darunter die Bereitstellung der Lagerfläche (18.500 m²), die Gefahrgutlagerung nach TRGS 510 und alle kommerziellen Vertragsbedingungen (Preisfestschreibung, Haftung, Versicherung).
              - paragraph [ref=f13e198]: "Die Analyse trägt erhebliche Vorbehalte: 16 Anforderungen erfordern interne Klärung (NEEDS_INPUT), 14 Kundenfragen sind offen, und zwei Zahlenwidersprüche zwischen Leistungsbeschreibung und Mengengerüst wurden vom Nutzer als klärungsbedürftig markiert. Ohne Beantwortung dieser Punkte kann keine belastbare Angebotskalkulation erfolgen."
              - paragraph [ref=f13e199]:
                - strong [ref=f13e200]: "Empfehlung:"
                - text: Angebotsabgabe unter Vorbehalt der Klärung aller 14 Kundenfragen und der internen Bestätigung von Lagerkapazität, Gefahrgutlagerung und kommerziellen Bedingungen. Die Zuschlagschancen hängen maßgeblich davon ab, ob wir die fehlenden Infrastrukturkapazitäten (Hallenfläche, Palettenstellplätze, Gefahrgutlager) nachweisen können.
              - heading "Erfüllungsgrad je Leistungsbereich" [level=2] [ref=f13e201]
              - paragraph [ref=f13e202]: Operative Prozesse (Wareneingang, Kommissionierung, Warenausgang, Retouren) sind weitgehend abgedeckt, jedoch mit Teilabweichungen bei Cut-off-Zeiten und Kühlzonenbetrieb. Kommerzielle und rechtliche Anforderungen (Vertragslaufzeit, Haftung, Versicherung) erfordern vollständige interne Klärung. IT-Schnittstellen zu SAP S/4HANA sind vorhanden, setzen jedoch kundenseitige ERP-Anbindung voraus.
